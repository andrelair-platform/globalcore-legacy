spring.application.name=globalcore-legacy
server.port=8080

# One shared datasource (legacy: everything through the same schema)
spring.datasource.url=${GC_DB_URL:jdbc:postgresql://localhost:5432/globalcore?currentSchema=gcore}
spring.datasource.username=${GC_DB_USER:gcore}
spring.datasource.password=${GC_DB_PASS:gcore}
spring.datasource.driver-class-name=org.postgresql.Driver

# "Nightly" batch cron (dev: every 2 minutes; a real one would be a nightly window)
gcore.batch.cron=${GC_BATCH_CRON:0 */2 * * * *}

logging.level.com.globalcorp.gcore=INFO
